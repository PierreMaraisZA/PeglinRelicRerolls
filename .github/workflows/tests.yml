name: Tests

# Runs the unit tests for the game rules in src/Core. The mod itself isn't built here:
# it references the game's own DLLs, which can't be committed to the repo.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test tests/PeglinRelicRerolls.Tests.csproj --nologo
